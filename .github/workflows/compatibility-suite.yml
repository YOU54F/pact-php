name: Compatibility Suite

on:
  push:
    branches:
      - master
      - 'release/**'
      - '!release/9.x'
  pull_request:
    branches:
      - master
      - 'release/**'
      - '!release/9.x'

env:
  PACT_LOGLEVEL: debug
  PACT_DO_NOT_TRACK: true

jobs:
  v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.2
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run Behat
        run: vendor/bin/behat compatibility-suite/pact-compatibility-suite/features/V1 --colors
  v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.2
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run Behat
        run: vendor/bin/behat compatibility-suite/pact-compatibility-suite/features/V2 --colors
  v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.2
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run Behat
        run: vendor/bin/behat compatibility-suite/pact-compatibility-suite/features/V3 --name '/^((?!binary body \(negative|Message provider).)*$/' --colors
  v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.2
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - uses: pact-foundation/pact-cli@ce8e65692ad3ea9d11244749ae24c8c49225d95f # main

      - name: Install sync-message-test plugin
        run: pact plugin install https://github.com/tienvx/pact-sync-message-test-plugin/releases/tag/0.2.0 -y

      - name: Run Behat
        run: vendor/bin/behat compatibility-suite/pact-compatibility-suite/features/V4 --colors
  v4-plugins:
    # The plugin features are not in the pinned submodule yet. Set the repository variable
    # PACT_COMPAT_SUITE_PLUGINS_REF to a pact-compatibility-suite ref that has features/V4/plugins to run them.
    if: vars.PACT_COMPAT_SUITE_PLUGINS_REF != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pact-foundation/pact-compatibility-suite
          ref: ${{ vars.PACT_COMPAT_SUITE_PLUGINS_REF }}
          path: pact-compatibility-suite-plugins

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.2
          extensions: sockets
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - uses: pact-foundation/pact-cli@ce8e65692ad3ea9d11244749ae24c8c49225d95f # main

      - name: Install plugins
        run: |
          # matt is not in the plugin repository index, so it is installed from its release.
          pact plugin install https://github.com/mefellows/pact-matt-plugin/releases/tag/v0.1.1 -y
          pact plugin install csv --version 0.0.6 -y
          pact plugin install avro --version 0.1.3 -y
          pact plugin install protobuf --version 0.8.0 -y

      - name: Run Behat
        run: vendor/bin/behat --suite=v4_plugins --colors
        env:
          PACT_COMPAT_SUITE: ${{ github.workspace }}/pact-compatibility-suite-plugins
